<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>山海車露 · Camper Trails</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--gold:#e9b872}
html,body{height:100%;overflow:hidden;background:#0d1512;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#f3efe6;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
.glass{background:rgba(20,28,25,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- menu */
#menu{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));pointer-events:none}
.card{pointer-events:auto;width:min(480px,100%);max-height:60dvh;overflow:auto;padding:18px 16px 16px;-webkit-overflow-scrolling:touch}
@media (min-aspect-ratio:1/1){#menu{justify-content:flex-start;align-items:center;padding:calc(16px + var(--st)) 40px calc(16px + var(--sb)) calc(32px + var(--sl))}.card{max-height:100%}}
.t1{font-size:26px;font-weight:800;letter-spacing:.14em}
.t2{font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:15px;margin-top:2px}
.t3{font-size:13px;opacity:.75;margin-top:6px;line-height:1.5}
.sec{font-size:12px;letter-spacing:.16em;opacity:.62;margin:16px 0 8px;display:flex;justify-content:space-between}
.sec i{font-style:normal;letter-spacing:0;opacity:.8}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts.two{grid-template-columns:1fr 1fr}.opts.four{grid-template-columns:repeat(4,1fr)}.opts.five{grid-template-columns:repeat(5,1fr)}
.opt{position:relative;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 4px;text-align:center;transition:.15s;cursor:pointer}
.opt.sel{border-color:var(--gold);background:rgba(233,184,114,.16)}
.opt .ic{font-size:25px;line-height:1.15}.opt .nm{font-size:12.5px;font-weight:700;margin-top:3px}.opt .ds{font-size:10.5px;opacity:.65;margin-top:2px;line-height:1.35}
.opt .badge{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#1d2420;font-size:12px;font-weight:800;line-height:22px;padding:0 5px}
.opt .minus{position:absolute;top:-7px;left:-5px;width:22px;height:22px;border-radius:11px;border:0;background:#55605a;color:#fff;font-size:15px;line-height:20px}
.colors{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.sw.sel{outline:2.5px solid var(--gold);outline-offset:2px}
#start{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--gold);color:#1d2420;font-weight:800;font-size:17px;letter-spacing:.12em}
.hint{font-size:11px;opacity:.55;margin-top:10px;line-height:1.6;text-align:center}
/* ---------- hud */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#tl{position:absolute;left:calc(10px + var(--sl));top:calc(10px + var(--st));padding:9px 12px;max-width:min(52vw,300px)}
#tl .a{font-weight:800;letter-spacing:.12em;font-size:14px}
#tl .b{font-size:12px;opacity:.72;margin-top:2px}
#tl .cnt{font-size:12.5px;margin-top:6px;color:var(--gold);font-weight:700;line-height:1.5}
#tl .near{font-size:12px;margin-top:3px;opacity:.85;display:flex;align-items:center;gap:6px}
#nArrow{display:inline-block;color:var(--gold)}
#tr{position:absolute;right:calc(10px + var(--sr));top:calc(10px + var(--st));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:124px;height:124px;border-radius:50%;border:2px solid rgba(255,255,255,.2);box-shadow:0 6px 20px rgba(0,0,0,.3);background:#2a3a2f;cursor:pointer}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:190px}
.sb{padding:7px 9px;font-size:12px;border-radius:10px}
#speed{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sb));padding:6px 16px;text-align:center;font-variant-numeric:tabular-nums}
#speed b{font-size:24px}#speed span{font-size:11px;opacity:.65;margin-left:3px}
#ret{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;display:none;text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 4px #000}#ret i{display:block;width:46px;height:46px;margin:0 auto 6px;border:2px solid rgba(255,255,255,.8);border-radius:50%;position:relative}#ret i:before,#ret i:after{content:'';position:absolute;background:rgba(255,255,255,.8);left:50%;top:50%}#ret i:before{width:2px;height:60px;margin:-30px 0 0 -1px}#ret i:after{height:2px;width:60px;margin:-1px 0 0 -30px}#ret.lock i{border-color:#ffd45a;box-shadow:0 0 12px #ffd45a}#ret.lock i:before,#ret.lock i:after{background:#ffd45a}
#menu .inp,#menu select{padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:inherit;font-size:14px;min-width:0}
#menu .inp{width:100%;box-sizing:border-box}#menu select option{color:#111}
.trow{display:flex;gap:6px;align-items:center;margin-top:7px}.trow .ti{font-size:20px;width:26px;text-align:center}.trow select{flex:1.1}.trow input{flex:1;width:0}
.trow button{border:0;border-radius:10px;background:rgba(255,255,255,.12);color:inherit;width:34px;height:34px;font-size:16px}
#petPrev{position:sticky;top:8px;z-index:3;margin-top:8px;border-radius:16px;background:rgba(16,24,21,.9);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;backdrop-filter:blur(8px)}
#petPrev canvas{width:150px;height:112px;border-radius:12px;background:linear-gradient(#a9d3e6,#cfe6c0);flex:none}#petPrev .pn{font-size:13px;opacity:.75;line-height:1.5}#petPrev .pn b{display:block;font-size:20px;opacity:1;color:#ffe9b0}
#acts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sb));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94vw}
#acts button{padding:12px 18px;border:0;border-radius:26px;background:var(--gold);color:#1d2420;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
#acts button.alt{background:rgba(20,28,25,.85);color:#f3efe6;border:1px solid rgba(255,255,255,.2)}
#toast{position:absolute;left:50%;top:calc(14px + var(--st));transform:translateX(-50%) translateY(-160%);padding:10px 16px;font-size:14px;transition:transform .35s;max-width:min(440px,calc(100% - 360px));min-width:200px;text-align:center;pointer-events:none;z-index:5}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:700px){#toast{top:calc(190px + var(--st));max-width:88vw;transform:translateX(-50%) translateY(-10px);opacity:0;transition:.35s}#toast.show{transform:translateX(-50%);opacity:1}#tl .cnt{font-size:11px}#tl{max-width:60vw}}
#bigmap{position:absolute;inset:0;background:rgba(8,12,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:var(--st) var(--sr) var(--sb) var(--sl)}
#bigC{width:min(92vw,76dvh);height:min(92vw,76dvh);border-radius:16px}
.mrow{display:flex;gap:10px}
#dex{font-size:13px;opacity:.9;text-align:center;line-height:1.7;max-width:92vw}
#bigmap button{padding:10px 26px;border-radius:20px;border:0;background:var(--gold);color:#1d2420;font-weight:800}
/* ---------- touch */
#touch{position:fixed;left:0;right:0;bottom:0;pointer-events:none;padding:0 calc(14px + var(--sr)) calc(16px + var(--sb)) calc(14px + var(--sl));display:flex;justify-content:space-between;align-items:flex-end}
#touch .g{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
#touch button{width:70px;height:70px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(20,28,25,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:24px;touch-action:none;line-height:1.15}
#touch button.small{font-size:13px;font-weight:700}
#touch button.gas{height:94px;border-radius:24px;font-size:14px;font-weight:800;background:rgba(233,184,114,.35)}
#touch button.on{background:rgba(233,184,114,.8);color:#1d2420}
body.touch #speed{bottom:calc(104px + var(--sb))}
body.touch #acts{bottom:calc(160px + var(--sb))}
@media (min-aspect-ratio:1/1){body.touch #speed{bottom:calc(16px + var(--sb))}body.touch #acts{bottom:calc(76px + var(--sb))}}
/* first-person cockpit: keep HUD out of the way of the wheel/cluster/GPS screen */
body.ck #speed{display:none}
body.ck #touch button{width:58px;height:58px;background:rgba(20,28,25,.38)}
body.ck #touch button.gas{height:80px;width:58px;background:rgba(233,184,114,.26)}
@media (min-aspect-ratio:1/1){
body.ck #acts{left:calc(14px + var(--sl));right:auto;transform:none;bottom:calc(86px + var(--sb));flex-direction:column;align-items:flex-start;gap:6px;width:auto;max-width:none}
body.ck #acts button{padding:8px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.ck #tl{padding:6px 10px;max-width:34vw}body.ck #tl .cnt{display:none}body.ck #tl .b{display:none}
}
/* ---------- film */
#film{position:fixed;inset:0;pointer-events:none}
#film .bar{position:absolute;left:0;right:0;background:rgba(0,0,0,.84);pointer-events:auto;display:flex;align-items:center;justify-content:center}
#film .top{top:0;height:calc(54px + var(--st));padding-top:var(--st);justify-content:flex-end;padding-right:calc(10px + var(--sr));gap:6px}
#film .top button{padding:7px 11px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-size:12.5px}
#film .top .lbl{margin-right:auto;padding-left:calc(14px + var(--sl));font-size:12px;letter-spacing:.2em;opacity:.6}
#film .bot{bottom:0;min-height:calc(92px + var(--sb));padding:10px 16px calc(10px + var(--sb));flex-direction:column;text-align:center}
#capT{font-size:12px;letter-spacing:.25em;color:var(--gold)}
#capS{font-size:18px;font-weight:700;margin-top:6px;letter-spacing:.06em;transition:opacity .3s;min-height:1.4em}
#prog{position:absolute;left:0;top:0;height:2px;background:var(--gold);width:0}
body.film #hud>*:not(#toast){display:none!important}
body.film #touch{display:none!important}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,13,.88);font-size:16px;letter-spacing:.15em}
#err{position:fixed;left:10px;bottom:10px;right:10px;font-size:12px;color:#ffb4a8;white-space:pre-wrap;pointer-events:none}
</style>
</head>

    <div class="sec">旅伴 <i>點一下＋1，不限隻數；下方可選品種、取名字</i></div><div class="opts four" id="petOpts"></div><div id="petPrev"><canvas id="ppc" width="300" height="224"></canvas><div class="pn" id="ppn"></div></div><div id="teamList"></div>

    <button id="start">出發 →</button>

  </div>
</div>

<canvas id="wsr" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none"></canvas>
<div id="hud" class="hidden">

    <div class="cnt" id="stats"></div>
    <div class="near"><span id="nArrow">➤</span><span id="nText"></span></div>

      <button class="sb glass" id="bView">視角</button>
      <button class="sb glass" id="bTime">🌙</button>
      <button class="sb glass" id="bMenu">選單</button>
    </div>
  </div>
  <div id="speed" class="glass"><b id="spd">0</b><span id="spdU">km/h</span></div>
  <div id="ret"><i></i><span id="retT"></span></div>
  <div id="acts"></div>
  <div id="toast" class="glass"></div>
  <div id="bigmap" class="hidden"><canvas id="bigC" width="720" height="720"></canvas><div id="dex"></div><div class="mrow"><button id="bNavNear">🧭 去最近的營地</button><button id="bCloseMap">關閉地圖</button></div></div>
</div>

<div id="touch" class="hidden">
  <div class="g"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="g"><button data-k="brake" class="small" id="tBrake">煞車<br>倒車</button><button data-k="gas" class="gas" id="tGas">油門</button></div>
</div>

<div id="film" class="hidden">
  <div class="bar top"><span class="lbl">CAMP VLOG</span><button id="fSpeed">⏩ 1x</button><button id="fNext">⏭ 下一幕</button><button id="fSelf">🙋 自己來</button></div>
  <div class="bar bot"><div id="prog"></div><div id="capT"></div><div id="capS"></div></div>
</div>

<div id="err"></div>

</script>

let curDish=null;
function chooseDish(){
  const all=cfg.dishes,made=dex.dishes||[];let d=null;const f=window.__forceDish;
  if(f!=null)d=all[f];
  else{const withItem=all.filter(x=>x.u&&(dex.items[x.u]||0)>0&&!made.includes(x.n));
    if(withItem.length&&Math.random()<.85)d=pick(withItem);
    else{const fresh=all.filter(x=>!made.includes(x.n));d=pick(fresh.length?fresh:all.filter(x=>x.n!==dex.lastDish))}}
  let used=false;if(d.u&&(dex.items[d.u]||0)>0){dex.items[d.u]--;used=true}
  const isNew=!made.includes(d.n);if(isNew){dex.dishes=made.concat(d.n)}dex.lastDish=d.n;saveDex();updateStats();
  return{d,used,isNew};
}
